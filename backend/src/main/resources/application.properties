spring.application.name=dietTotalBackend

# 외부 API 키 — 환경변수로 주입 (없으면 해당 기능만 꺼짐)
spoonacular.api.key=${SPOONACULAR_API_KEY:}
mfds.api.key=${MFDS_API_KEY:}
mfds.api.base-url=https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo03
mfds.api.operation=getFoodNtrCpntDbInq03

# MySQL (팀 공통 환경변수 이름)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블이 없거나 컬럼이 부족하면 Hibernate가 채워줌 (sql/dietapp_schema.sql로 먼저 만들어 두면 확실함)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 서버 시작 시 resources/diet_menu_seed.json 을 diet_menus 에 반영 (끄려면 false)
app.seed.diet-menus.enabled=true

# [1회용] true 로 바꾸고 서버를 한 번 실행하면 DB에 평문으로 남은 비밀번호를 BCrypt 해시로 일괄 변환합니다. 실행 후 false 로 되돌리세요.
# (변환하지 않아도 각 사용자가 로그인할 때 자동으로 해시로 바뀝니다.)
app.security.migrate-plain-passwords=false

ai.server.url=${AI_SERVER_URL:http://127.0.0.1:8000}
