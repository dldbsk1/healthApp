spring.application.name=dietapp

# =========================
# MySQL
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:}
jwt.access-token-expire-ms=3600000
jwt.refresh-token-expire-ms=1209600000

# =========================
# AI Server
# =========================
# 식단 AI (음식 사진 분석), 구 이름 AI_SERVER_URL 호환 / 운동 AI는 백엔드 호출 없음
ai.diet.base-url=${DIET_AI_SERVER_URL:${AI_SERVER_URL:http://127.0.0.1:8000}}

# =========================
# 식약처 음식 검색 (키 없으면 내부 DB만)
# =========================
mfds.api.key=${MFDS_API_KEY:}
mfds.api.base-url=https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo03
mfds.api.operation=getFoodNtrCpntDbInq03

# =========================
# 초기 데이터 / 1회용
# =========================
# diet_menu_seed.json → diet_menus upsert
app.seed.diet-menus.enabled=true
# 평문 비밀번호 → BCrypt 일괄 변환 (1회 실행 후 false)
app.security.migrate-plain-passwords=false

# =========================
# Server
# =========================
server.port=8080

# =========================
# File Upload
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# AWS S3
# =========================
file.storage.s3.bucket=${S3_BUCKET:}
file.storage.s3.region=${AWS_REGION:ap-northeast-2}