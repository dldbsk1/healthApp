spring.application.name=dietapp

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt:
secret: ${JWT_SECRET}
access-token-expire-ms: 3600000
refresh-token-expire-ms: 1209600000

ai-server:
# Python ?? ?? / ?? ??? ?? ?? ??
base-url: ${AI_SERVER_URL:http://localhost:8000}

server:
port: 8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.storage.s3.bucket=${S3_BUCKET:}
file.storage.s3.region=${AWS_REGION:ap-northeast-2}
