spring.application.name=dietapp

# =========================
# MySQL
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# MongoDB
# =========================
spring.mongodb.uri=${MONGODB_URI}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.access-token-expire-ms=3600000
jwt.refresh-token-expire-ms=1209600000

# =========================
# AI Server
# =========================
ai-server.base-url=${AI_SERVER_URL:http://localhost:8000}

# =========================
# Server
# =========================
server.port=8080

# =========================
# File Upload
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# AWS S3
# =========================
file.storage.s3.bucket=${S3_BUCKET:}
file.storage.s3.region=${AWS_REGION:ap-northeast-2}