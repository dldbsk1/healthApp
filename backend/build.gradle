plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // 아까 에러를 해결하기 위해 맞춘 Java 21 버전 설정
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. 기본적인 REST API 및 웹 환경 구축 (Spring Web)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 2. 파이썬 AI 서버와 통신할 WebClient 도구 포함 (Spring Reactive Web)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 3. Getter, Setter 코드 자동 생성 편리 도구 (Lombok)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 4. MySQL + JPA (MongoDB 의존성 대체)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 5. 비밀번호 해시(BCrypt) — 암호화 모듈만 사용 (로그인 차단 필터가 붙는 전체 Spring Security는 아님)
    implementation 'org.springframework.security:spring-security-crypto'

    // 테스트 환경용 라이브러리
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}